
name: Build ChessMate APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.6"

      - name: Extract project
        run: unzip -q ChessMateAndroid.zip

      
      - name: Pin Compose versions
        run: |
          sed -i 's/compose-bom:2026.08.00/compose-bom:2025.08.00/' ChessMateAndroid/app/build.gradle.kts
          sed -i 's/activity-compose:1.12.1/activity-compose:1.10.1/' ChessMateAndroid/app/build.gradle.kts

      - name: Build APK
        run: |
          cd ChessMateAndroid
          gradle --no-daemon :app:assembleDebug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessMate-APK
          path: ChessMateAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
